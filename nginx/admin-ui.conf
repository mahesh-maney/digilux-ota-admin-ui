# Rate limiting zones
limit_req_zone $binary_remote_addr zone=general:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=static:10m rate=50r/s;

server {
    listen 80;
    server_name _;

    root /var/www/admin-ui;
    index index.html;

    client_max_body_size 1m;

    # Security headers
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https://iot.digilux.co.in https://*.amazoncognito.com https://cognito-idp.ap-south-1.amazonaws.com https://*.execute-api.ap-south-1.amazonaws.com https://*.s3.amazonaws.com https://*.s3.ap-south-1.amazonaws.com; font-src 'self' data:; frame-ancestors 'none'; object-src 'none';" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;

    # SPA routing — rate limited
    location / {
        limit_req zone=general burst=40 nodelay;
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively (hashed filenames)
    location ~* \.(js|css|woff2?|png|ico|svg)$ {
        limit_req zone=static burst=100 nodelay;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
